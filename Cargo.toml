[package]
name = "fejdit"
version = "0.1.0"
edition = "2024"
description = "Query and edit Valheim (Fejd) world and character save files"
license = "MIT"
rust-version = "1.88"

[dependencies]
anyhow = "1.0"
base64 = "0.23"
binrw = "0.15"
flate2 = "1.1"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
globset = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
